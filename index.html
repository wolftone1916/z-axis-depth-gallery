<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshua Lee - Iron Man Interface</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background Grid Effect -->
    <div class="holographic-background"></div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- 3D Gallery Viewport (Fixed) -->
        <div class="perspective-container">
            <div class="gallery-viewport" id="galleryViewport">
                <!-- All cards rendered here for 3D effect -->
            </div>
        </div>

        <!-- Scroll trigger container -->
        <div class="scroll-spacer"></div>
    </div>

    <!-- Info Panel -->
    <div class="info-panel">
        <div class="panel-header">
            <h3>ACTIVE ELEMENT</h3>
            <button class="close-btn">✕</button>
        </div>
        <div class="panel-content">
            <p id="element-info">Select a card to view details</p>
        </div>
    </div>

    <!-- Instructions Overlay -->
    <div class="instructions-overlay">
        <div class="instructions-card">
            <h2>Iron Man Interface</h2>
            <ul>
                <li><strong>Scroll:</strong> Move through cards (Z-axis)</li>
                <li><strong>Drag:</strong> Move cards around the screen</li>
                <li><strong>Click Card:</strong> View details</li>
                <li><strong>Right Click:</strong> Push to background</li>
            </ul>
            <button class="close-instructions">Got it!</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/gallery.js"></script>
</body>
</html>
